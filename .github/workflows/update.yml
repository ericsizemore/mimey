name: "Update Mime Types"

on:
  schedule:
    - cron: "0 10 1 */3 *"
  workflow_dispatch:

jobs:
  update:
    name: "Update Mime Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
           fetch-depth: 2
           token: ${{ secrets.PAT }}

      - name: "Install PHP"
        uses: shivammathur/setup-php@master
        with:
           php-version: 8.2
           extensions: mbstring, 
           coverage: xdebug,

      - name: "Validate composer.json and composer.lock"
        run: composer validate --strict

      - name: "Setup Composer, install dependencies"
        uses: ramsey/composer-install@4.0.0
        with:
           composer-options: "--prefer-dist --optimize-autoloader"
           require-lock-file: "false"
           dependency-versions: "highest"

      - name: "Run update"
        run: composer run-script update-types

      - name: "Run test suite"
        run: composer run-script phpunit
   
      - name: "Coverage check"
        run: composer run-script code-coverage

      - name: "Import GPG key"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: "Commit and push changes"
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
           commit_author: "${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>"
           commit_user_name: ${{ steps.import-gpg.outputs.name }}
           commit_user_email: ${{ steps.import-gpg.outputs.email }}
           commit_message: 'chore: Update mime.types'
           commit_options: '-S --amend --no-edit'
           push_options: '--force'
           skip_fetch: true
